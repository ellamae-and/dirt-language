<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dirt Web IDE</title>
  </head>

  <body>

    <div class="app">
      <div class="ide-box">

        <!--HEADER-->
        <header class="header">
          <div class="header-left">
            <h1>
              <svg class="hex-logo" aria-hidden="true"
                   width="30" height="32" viewBox="0 0 30 32" fill="none"
                   xmlns="http://www.w3.org/2000/svg">
                <polygon class="hex-ring" points="15,2 27,9 27,23 15,30 3,23 3,9"/>
                <polygon class="hex-fill" points="15,5 24,10.5 24,21.5 15,27 6,21.5 6,10.5"/>
                <ellipse class="hex-dirt" cx="15" cy="27" rx="7" ry="2.5"/>
                <path    class="hex-stem"   d="M15 26 L15 14" stroke-width="2" stroke-linecap="round"/>
                <path    class="hex-leaf-l" d="M15 19 Q8 16 9 9 Q13 12 15 18"/>
                <path    class="hex-leaf-r" d="M15 15 Q22 12 22 5 Q18 9 15 15"/>
              </svg>
              Dirt Web IDE
            </h1>
            <p>Simple interpreter for the Dirt programming language</p>
          </div>

          <div class="header-right">
            <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
              <span class="icon-text">Light</span>
            </button>
          </div>
        </header>

        <!--MAIN CONTENT-->
        <main class="content">

          <div class="topbar">
            <div class="label">Projects:</div>
            <div class="select-wrap">
              <select id="examples" class="select"></select>
              <span class="chev" aria-hidden="true">▾</span>
            </div>
            <button id="newBtn"    class="btn btn-secondary" type="button">New</button>
            <button id="saveBtn"   class="btn btn-secondary" type="button">
              <span class="unsaved-dot" aria-hidden="true"></span>Save Project
            </button>
            <button id="deleteBtn" class="btn btn-secondary" type="button">Delete</button>
          </div>

          <div class="grid">

            <!--EDITOR CARD-->
            <section class="card editor-card">

              <!--
                CodeMirror 6 injects its own DOM tree
                into it at runtime.
              -->
              <div id="editor" class="editor" aria-label="Code editor"></div>

              <div id="errorBar" class="error-bar is-hidden" aria-live="polite"></div>

              <div class="status-bar" aria-label="Editor status">
                <div class="status-left">
                  <span id="statusCursor">Ln 1, Col 1</span>
                  <span id="statusChars">0 chars</span>
                  <span id="statusLines">0 lines</span>
                </div>
                <div class="status-right">
                  <span class="status-pill">Dirt</span>
                  <span>UTF-8</span>
                </div>
              </div>

              <div class="actions">
                <button id="runBtn"   class="btn btn-primary"   type="button">
                  <span class="play" aria-hidden="true">▶</span>Run
                </button>
                <button id="clearBtn" class="btn btn-secondary" type="button">Clear</button>
                <span id="unsavedLabel" class="unsaved-label is-hidden" aria-live="polite">● unsaved</span>
              </div>
            </section>

            <!--OUTPUT CARD-->
            <section class="card output-card">
              <div class="tabs">
                <button class="tab is-active" data-tab="output" type="button">Output</button>
                <button class="tab"           data-tab="canvas" type="button">Canvas</button>
                <button class="tab"           data-tab="tokens" type="button">Tokens</button>
                <button class="tab"           data-tab="ast"    type="button">AST</button>
                <button class="tab"           data-tab="env"    type="button">Env</button>
              </div>
              <div class="output">
                <pre id="outBox" data-pane="output"></pre>
                <pre id="tokBox" data-pane="tokens" class="is-hidden"></pre>
                <pre id="astBox" data-pane="ast"    class="is-hidden"></pre>
                <pre id="envBox" data-pane="env"    class="is-hidden"></pre>
                <div id="canvasPane" data-pane="canvas" class="canvas-pane is-hidden">
                  <canvas id="gameCanvas" width="640" height="360" aria-label="Game canvas"></canvas>
                </div>
              </div>
            </section>

          </div>
        </main>
      </div>
    </div>

    <!--
      Three grass/soil layers fixed at the bottom of the viewport.
    -->
    <svg class="bg-grass bg-grass--back"  aria-hidden="true" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120">
      <path d="M0,80 C115,42 207,98 288,65 C374,32 461,88 576,60 C691,32 748,82 864,68 C979,54 1036,28 1152,52 C1267,75 1354,38 1440,55 L1440,120 L0,120 Z"/>
    </svg>
    <svg class="bg-grass bg-grass--mid"   aria-hidden="true" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120">
      <path d="M0,88 C120,55 216,102 360,72 C504,42 576,95 720,75 C864,55 936,98 1080,70 C1224,42 1332,85 1440,65 L1440,120 L0,120 Z"/>
    </svg>
    <svg class="bg-grass bg-grass--front" aria-hidden="true" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120">
      <path d="M0,95 C180,62 288,108 432,82 C576,56 648,100 792,80 C936,60 1008,102 1152,78 C1296,54 1368,90 1440,72 L1440,120 L0,120 Z"/>
    </svg>

    <!--
      CSS-animated SVG clouds
    -->

         style="top:5vh; width:380px; animation-duration:110s; animation-delay:0s"
         viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <g fill="hsla(0,0%,100%,0.7)" stroke-width="1" stroke="hsla(0,0%,100%,0.85)" transform="matrix(1,0,0,1,0,100)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 150 350 A 1 1 0 1 1 200 200 A 1 1 0 1 1 350 200 A 1 1 0 1 1 550 300 A 1 1 0 1 1 600 400 A 1 1 0 1 1 550 500 A 1 1 0 1 1 350 450 A 1 1 0 1 1 150 350 Z"/>
      </g>
    </svg>

    <svg class="bg-cloud" aria-hidden="true"
         style="top:5vh; width:240px; animation-duration:145s; animation-delay:-38s"
         viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <g fill="hsla(0,0%,100%,0.7)" stroke-width="1" stroke="hsla(0,0%,100%,0.85)" transform="matrix(1,0,0,1,0,100)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 500 250 A 1 1 0 1 1 450 400 A 1 1 0 1 1 250 350 A 1 1 0 1 1 300 250 A 1 1 0 1 1 500 250 Z"/>
      </g>
    </svg>

    <svg class="bg-cloud" aria-hidden="true"
         style="top:4vh; width:520px; animation-duration:90s; animation-delay:-62s"
         viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <g fill="hsla(0,0%,100%,0.7)" stroke-width="1" stroke="hsla(0,0%,100%,0.85)" transform="matrix(1,0,0,1,0,100)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 300 600 A 1 1 0 1 1 200 400 A 1 1 0 1 1 200 250 A 1 1 0 1 1 350 200 A 1 1 0 1 1 500 250 A 1 1 0 1 1 650 400 A 1 1 0 1 1 550 500 A 1 1 0 1 1 450 550 A 1 1 0 1 1 300 600 Z"/>
      </g>
    </svg>

    <svg class="bg-cloud" aria-hidden="true"
         style="top:10vh; width:200px; animation-duration:125s; animation-delay:-15s"
         viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <g fill="hsla(0,0%,100%,0.7)" stroke-width="1" stroke="hsla(0,0%,100%,0.85)" transform="matrix(1,0,0,1,0,100)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 500 400 A 1 1 0 1 1 300 350 A 1 1 0 1 1 250 300 A 1 1 0 1 1 350 250 A 1 1 0 1 1 500 200 A 1 1 0 1 1 600 250 A 1 1 0 1 1 500 400 Z"/>
      </g>
    </svg>

    <svg class="bg-cloud" aria-hidden="true"
         style="top:8vh; width:460px; animation-duration:105s; animation-delay:-80s"
         viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <g fill="hsla(0,0%,100%,0.7)" stroke-width="1" stroke="hsla(0,0%,100%,0.85)" transform="matrix(1,0,0,1,0,100)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 150 350 A 1 1 0 1 1 200 200 A 1 1 0 1 1 350 200 A 1 1 0 1 1 550 300 A 1 1 0 1 1 600 400 A 1 1 0 1 1 550 500 A 1 1 0 1 1 350 450 A 1 1 0 1 1 150 350 Z"/>
      </g>
    </svg>

    <svg class="bg-cloud" aria-hidden="true"
         style="top:10vh; width:160px; animation-duration:80s; animation-delay:-50s"
         viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <g fill="hsla(0,0%,100%,0.7)" stroke-width="1" stroke="hsla(0,0%,100%,0.85)" transform="matrix(1,0,0,1,0,100)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 500 250 A 1 1 0 1 1 450 400 A 1 1 0 1 1 250 350 A 1 1 0 1 1 300 250 A 1 1 0 1 1 500 250 Z"/>
      </g>
    </svg>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
