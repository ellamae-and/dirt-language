<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dirt Web IDE</title>
  </head>

  <body>

    <div class="app">
      <div class="ide-box">

        <!--HEADER-->
        <header class="header">
          <div class="header-left">
            <h1>
              <svg class="hex-logo" aria-hidden="true"
                   width="30" height="32" viewBox="0 0 30 32" fill="none"
                   xmlns="http://www.w3.org/2000/svg">
                <polygon class="hex-ring" points="15,2 27,9 27,23 15,30 3,23 3,9"/>
                <polygon class="hex-fill" points="15,5 24,10.5 24,21.5 15,27 6,21.5 6,10.5"/>
                <ellipse class="hex-dirt" cx="15" cy="27" rx="7" ry="2.5"/>
                <path    class="hex-stem"   d="M15 26 L15 14" stroke-width="2" stroke-linecap="round"/>
                <path    class="hex-leaf-l" d="M15 19 Q8 16 9 9 Q13 12 15 18"/>
                <path    class="hex-leaf-r" d="M15 15 Q22 12 22 5 Q18 9 15 15"/>
              </svg>
              Dirt Web IDE
            </h1>
            <p>Simple interpreter for the Dirt programming language</p>
          </div>

          <div class="header-right">
            <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
              <span class="icon-text">Light</span>
            </button>
          </div>
        </header>

        <!--MAIN CONTENT-->
        <main class="content">

          <div class="topbar">
            <div class="label">Projects:</div>
            <div class="select-wrap">
              <select id="examples" class="select"></select>
              <span class="chev" aria-hidden="true">▾</span>
            </div>
            <button id="newBtn"    class="btn btn-secondary" type="button">New</button>
            <button id="saveBtn"   class="btn btn-secondary" type="button">
              <span class="unsaved-dot" aria-hidden="true"></span>Save Project
            </button>
            <button id="deleteBtn" class="btn btn-secondary" type="button">Delete</button>
          </div>

          <div class="grid">

            <!--EDITOR CARD-->
            <section class="card editor-card">

              <!--
                #editor is now a plain div — CodeMirror 6 injects its own DOM tree
                into it at runtime. The old textarea, highlight overlay, and gutter
                divs are gone; CM6 provides all of that natively.
              -->
              <div id="editor" class="editor" aria-label="Code editor"></div>

              <div id="errorBar" class="error-bar is-hidden" aria-live="polite"></div>

              <div class="status-bar" aria-label="Editor status">
                <div class="status-left">
                  <span id="statusCursor">Ln 1, Col 1</span>
                  <span id="statusChars">0 chars</span>
                  <span id="statusLines">0 lines</span>
                </div>
                <div class="status-right">
                  <span class="status-pill">Dirt</span>
                  <span>UTF-8</span>
                </div>
              </div>

              <div class="actions">
                <button id="runBtn"   class="btn btn-primary"   type="button">
                  <span class="play" aria-hidden="true">▶</span>Run
                </button>
                <button id="clearBtn" class="btn btn-secondary" type="button">Clear</button>
                <span id="unsavedLabel" class="unsaved-label is-hidden" aria-live="polite">● unsaved</span>
              </div>
            </section>

            <!--OUTPUT CARD-->
            <section class="card output-card">
              <div class="tabs">
                <button class="tab is-active" data-tab="output" type="button">Output</button>
                <button class="tab"           data-tab="canvas" type="button">Canvas</button>
                <button class="tab"           data-tab="tokens" type="button">Tokens</button>
                <button class="tab"           data-tab="ast"    type="button">AST</button>
                <button class="tab"           data-tab="env"    type="button">Env</button>
              </div>
              <div class="output">
                <pre id="outBox" data-pane="output"></pre>
                <pre id="tokBox" data-pane="tokens" class="is-hidden"></pre>
                <pre id="astBox" data-pane="ast"    class="is-hidden"></pre>
                <pre id="envBox" data-pane="env"    class="is-hidden"></pre>
                <div id="canvasPane" data-pane="canvas" class="canvas-pane is-hidden">
                  <canvas id="gameCanvas" width="640" height="360" aria-label="Game canvas"></canvas>
                </div>
              </div>
            </section>

          </div>
        </main>
      </div>
    </div>

    <!-- Sky/stars/soil canvas — drawn by main.ts -->
    <canvas id="sporeBg" aria-hidden="true"></canvas>

    <!-- CSS-animated SVG clouds — drift left endlessly via @keyframes cloudDrift -->
    <svg class="bg-cloud" aria-hidden="true"
         style="top:6vh; width:260px; animation-duration:110s; animation-delay:0s"
         viewBox="0 0 260 90" xmlns="http://www.w3.org/2000/svg">
      <circle class="cloud-fill" cx="80"  cy="62" r="34"/>
      <circle class="cloud-fill" cx="120" cy="50" r="42"/>
      <circle class="cloud-fill" cx="166" cy="56" r="36"/>
      <circle class="cloud-fill" cx="200" cy="64" r="28"/>
      <circle class="cloud-fill" cx="50"  cy="68" r="26"/>
      <rect   class="cloud-fill" x="24" y="62" width="212" height="28" rx="4"/>
    </svg>

         viewBox="0 0 340 70" xmlns="http://www.w3.org/2000/svg">
      <circle class="cloud-fill" cx="90"  cy="46" r="28"/>
      <circle class="cloud-fill" cx="138" cy="36" r="36"/>
      <circle class="cloud-fill" cx="192" cy="40" r="32"/>
      <circle class="cloud-fill" cx="244" cy="46" r="26"/>
      <circle class="cloud-fill" cx="56"  cy="52" r="22"/>
      <circle class="cloud-fill" cx="290" cy="50" r="20"/>
      <rect   class="cloud-fill" x="34" y="48" width="276" height="22" rx="4"/>
    </svg>
    <svg class="bg-cloud" aria-hidden="true"
         style="top:5vh; width:170px; animation-duration:90s; animation-delay:-62s"
         viewBox="0 0 170 66" xmlns="http://www.w3.org/2000/svg">
      <circle class="cloud-fill" cx="56"  cy="44" r="26"/>
      <circle class="cloud-fill" cx="90"  cy="34" r="32"/>
      <circle class="cloud-fill" cx="126" cy="42" r="26"/>
      <circle class="cloud-fill" cx="38"  cy="50" r="20"/>
      <rect   class="cloud-fill" x="18" y="44" width="134" height="22" rx="4"/>
    </svg>
    <svg class="bg-cloud" aria-hidden="true"
         style="top:20vh; width:220px; animation-duration:125s; animation-delay:-15s"
         viewBox="0 0 220 72" xmlns="http://www.w3.org/2000/svg">
      <circle class="cloud-fill" cx="68"  cy="48" r="30"/>
      <circle class="cloud-fill" cx="110" cy="38" r="36"/>
      <circle class="cloud-fill" cx="156" cy="46" r="30"/>
      <circle class="cloud-fill" cx="44"  cy="54" r="22"/>
      <circle class="cloud-fill" cx="192" cy="54" r="20"/>
      <rect   class="cloud-fill" x="22" y="50" width="176" height="22" rx="4"/>
    </svg>
    <svg class="bg-cloud" aria-hidden="true"
         style="top:8vh; width:200px; animation-duration:105s; animation-delay:-80s"
         viewBox="0 0 200 86" xmlns="http://www.w3.org/2000/svg">
      <circle class="cloud-fill" cx="68"  cy="54" r="36"/>
      <circle class="cloud-fill" cx="108" cy="40" r="44"/>
      <circle class="cloud-fill" cx="152" cy="52" r="34"/>
      <circle class="cloud-fill" cx="42"  cy="62" r="26"/>
      <rect   class="cloud-fill" x="16" y="58" width="168" height="28" rx="4"/>
    </svg>
    <svg class="bg-cloud" aria-hidden="true"
         style="top:24vh; width:130px; animation-duration:80s; animation-delay:-50s"
         viewBox="0 0 130 52" xmlns="http://www.w3.org/2000/svg">
      <circle class="cloud-fill" cx="44"  cy="34" r="22"/>
      <circle class="cloud-fill" cx="72"  cy="26" r="26"/>
      <circle class="cloud-fill" cx="100" cy="34" r="20"/>
      <circle class="cloud-fill" cx="28"  cy="38" r="16"/>
      <rect   class="cloud-fill" x="12" y="36" width="106" height="16" rx="4"/>
    </svg>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
